<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <base href="https://start.bbs-papenburg.de/">
  <title>Unser Kollegium | BBS Papenburg</title>
</head>
<body>
  <!-- Ausschnitt des Layouts seit 11/2026, Namen frei erfunden -->
  <section data-bb-gruppe aria-labelledby="buchstabe-B">
    <h2 class="kol-buchstabe" id="buchstabe-B">B</h2>
    <div class="bb-personen bb-personen-kompakt">
      <article class="bb-person" data-bb-eintrag data-text="Bernd Beispiel BEBS" id="kuerzel-BEBS">
        <div class="bb-person-foto">
          <img src="images/Organisation_Dateien/kollegium/Beispiel_Bernd.jpg" alt="Foto von Bernd Beispiel" loading="lazy">
        </div>
        <div class="bb-person-text">
          <h3>Bernd Beispiel</h3>
          <p>Kürzel: <span class="kol-kuerzel">BEBS</span></p>
        </div>
        <div class="bb-person-aktionen">
          <a class="bb-knopf bb-knopf-voll" href="#"><i class="fas fa-envelope"></i> E-Mail senden</a>
        </div>
      </article>
      <article class="bb-person" data-bb-eintrag data-text="Clara Muster MUCL" id="kuerzel-MUCL">
        <div class="bb-person-foto">
          <i class="fas fa-user" aria-hidden="true"></i>
        </div>
        <div class="bb-person-text">
          <h3>Clara Muster</h3>
          <p>Kürzel: <span class="kol-kuerzel">MUCL</span></p>
        </div>
      </article>
      <article class="bb-person" data-bb-eintrag data-text="Nina Neu ">
        <div class="bb-person-foto">
          <img src="images/Organisation_Dateien/kollegium/Neu_Nina.jpg" alt="Foto von Nina Neu" loading="lazy">
        </div>
        <div class="bb-person-text">
          <h3>Nina Neu</h3>
          <p>&nbsp;</p>
        </div>
      </article>
    </div>
  </section>
</body>
</html>
