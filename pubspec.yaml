name: better_stundenplan
description: "A not-shit client for \"Virtueller Stundenplan\""
publish_to: 'none'

version: 1.3.1+7

environment:
  sdk: ^3.10.4
  flutter: 3.38.5

dependencies:
  flutter:
    sdk: flutter

  dynamic_color: ^1.8.1
  flutter_secure_storage: ^11.0.0
  go_router: ^14.8.0
  shared_preferences: ^2.5.2
  http: ^1.3.0
  html: ^0.15.5
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/background.png"
  adaptive_icon_foreground: "assets/foreground.png"

  adaptive_icon_monochrome: "assets/monochrome.png"
  min_sdk_android: 21