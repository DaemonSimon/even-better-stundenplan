name: Build and Release App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml # path to pubspec.yaml

    - name: Decode Keystore
      run: echo $ENCODED_STRING | base64 -di > ${{ github.workspace }}/upload-keystore.jks
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE }}

    - run: flutter pub get

    - name: Analyze
      run: flutter analyze --fatal-infos

    - name: Test
      run: flutter test

    - name: Prepare signing properties
      run: |
        cd android
        touch key.properties
        echo storePassword=$RELEASE_STOREPASSWORD >> key.properties
        echo keyPassword=$RELEASE_KEYPASSWORD >> key.properties
        echo keyAlias=$RELEASE_KEYALIAS >> key.properties
        echo storeFile=${{ github.workspace }}/upload-keystore.jks >> key.properties
      env:
        RELEASE_STOREPASSWORD: ${{ secrets.RELEASE_STOREPASSWORD }}
        RELEASE_KEYPASSWORD: ${{ secrets.RELEASE_KEYPASSWORD }}
        RELEASE_KEYALIAS: ${{ secrets.RELEASE_KEYALIAS }}

    - name: Build app bundle
      run: flutter build appbundle

    - name: Build split-per-abi APKs
      run: flutter build apk --split-per-abi

    - name: Compute checksums
      run: |
        cd build/app/outputs/flutter-apk
        sha256sum *.apk > SHA256SUMS.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          build/app/outputs/bundle/release/app-release.aab
          build/app/outputs/flutter-apk/*.apk
          build/app/outputs/flutter-apk/SHA256SUMS.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-artifacts
        path: artifacts

    - name: Set Version Environment Variable
      run: |
        version=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
        echo "VERSION=${version}" >> $GITHUB_ENV

    - name: Rename artifacts
      run: |
        cd artifacts
        for f in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk; do
          [ -f "$f" ] && mv "$f" "better_stundenplan-${{ env.VERSION }}-${f#app-}"
        done
        [ -f app-release.aab ] && mv app-release.aab "better_stundenplan-${{ env.VERSION }}.aab"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        release_name: Release ${{ env.VERSION }}
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: artifacts/*
